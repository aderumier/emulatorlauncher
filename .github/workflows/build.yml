name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild batocera-ports.sln /p:Configuration=Release /p:Platform=x64 /p:TargetFrameworkVersion=v4.8 /p:TargetFrameworkProfile= /m /nologo /v:minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulatorlauncher
          path: emulatorLauncher/bin/x64/Release/
